---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - kagi.pw
  resources:
  - kagicertificates
  - kagisecrets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kagi.pw
  resources:
  - kagicertificates/finalizers
  - kagisecrets/finalizers
  verbs:
  - update
- apiGroups:
  - kagi.pw
  resources:
  - kagicertificates/status
  - kagisecrets/status
  verbs:
  - get
  - patch
  - update
