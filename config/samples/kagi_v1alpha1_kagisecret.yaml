apiVersion: kagi.pw/v1alpha1
kind: KagiSecret
metadata:
  name: kagi-village-api
  namespace: kagi-operator-system
spec:
  # appId is the app's stable internal ID (durable machine binding). Resolve it
  # once from a folder path at setup and pin it here. Preferred over folderPath.
  appId: "00000000-0000-0000-0000-0000000000aa"
  # folderPath is the human-readable SECRETS folder path of the app, used only
  # when appId is empty (resolved to an app ID once per reconcile).
  # folderPath: /village/api
  environment: production
  # organization is optional. When set it is sent as an X-Organization-ID
  # cross-check and MUST match the PAT's bound org, or the Kagi API returns 403.
  # Leave empty to use the token's bound org (the default, single-org behavior).
  # organization: "00000000-0000-0000-0000-000000000001"
  tokenSecret:
    name: kagi-token-village-api
  managedSecret:
    name: village-api-secret
    namespace: village
