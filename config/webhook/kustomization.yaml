resources:
- manifests.yaml
- service.yaml

# manifests.yaml is generated by controller-gen and MUST NOT be hand-edited:
# `make manifests` (which `make build-installer` depends on) overwrites it, so a
# hand-added block silently disappears from the released dist/install.yaml.
# Anything controller-gen cannot express goes in a patch here instead.
patches:
- path: objectselector_patch.yaml

configurations:
- kustomizeconfig.yaml
