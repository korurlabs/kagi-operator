name: CI

# Tests, chart lint, and an image build with a vulnerability scan on every pull
# request and every push to main. Nothing is pushed: until the migration is done
# (MIGRATION.md), the images that run anywhere are built in korurlabs/village.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # make test go-installs controller-gen and setup-envtest and downloads the
      # Kubernetes control-plane binaries into bin/.
      - name: Cache tool binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin
          key: ${{ runner.os }}-operator-bin-${{ hashFiles('Makefile', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-operator-bin-

      - name: Run tests
        run: make test

      # make test regenerates the CRDs, RBAC and deepcopy code; a diff means
      # the committed files are stale.
      - name: Check generated files are committed
        run: git diff --exit-code

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Lint chart
        run: helm lint charts/kagi-operator
      - name: Render chart
        run: helm template kagi-operator charts/kagi-operator --namespace kagi-operator-system > /dev/null

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Loaded into the local Docker daemon, never pushed, so the next steps can
      # scan it.
      - name: Build image (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: kagi-operator:ci

      # The vulnerability database is rebuilt every few hours; one cache entry a
      # day, shared with the Trivy workflow, keeps the download off most runs.
      # Every run restores it; only main saves it, so pull requests do not each
      # store their own copy against the repository's cache budget.
      - name: Date for the Trivy cache key
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the Trivy database
        id: trivy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-

      # The same gate the release applies before it publishes: a fixable
      # CRITICAL or HIGH vulnerability in the image fails the pull request, so it
      # is fixed before it can block a release. trivy-action had its version
      # tags hijacked on 2026-03-19 (GHSA-69fq-xp46-6x23): it is pinned to the
      # commit of 0.35.0, which Aqua states was not affected, and the binary to
      # a fixed version published after the incident.
      - name: Scan image for fixable CRITICAL and HIGH vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.76.2
          # The database is cached by the step above.
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
          scan-type: image
          image-ref: kagi-operator:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Save the Trivy database
        if: github.ref == 'refs/heads/main' && steps.trivy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: ${{ steps.trivy-cache.outputs.cache-primary-key }}
