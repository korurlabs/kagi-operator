name: CI

# Tests, chart lint and an image build on every pull request and every push to
# main. Nothing is pushed: until the migration is done (MIGRATION.md), the
# images that run anywhere are built in korurlabs/village.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # make test go-installs controller-gen and setup-envtest and downloads the
      # Kubernetes control-plane binaries into bin/.
      - name: Cache tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-operator-bin-${{ hashFiles('Makefile', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-operator-bin-

      - name: Run tests
        run: make test

      # make test regenerates the CRDs, RBAC and deepcopy code; a diff means
      # the committed files are stale.
      - name: Check generated files are committed
        run: git diff --exit-code

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/kagi-operator
      - name: Render chart
        run: helm template kagi-operator charts/kagi-operator --namespace kagi-operator-system > /dev/null

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
