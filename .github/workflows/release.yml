name: Release

# Public release of the open-source kagi-operator artifacts, on a v* tag such as
# v0.5.0:
#   - multi-arch container image  -> ghcr.io/korurlabs/kagi-operator
#   - Helm chart (OCI)            -> oci://ghcr.io/korurlabs/charts/kagi-operator
#   - Artifact Hub ownership blob -> same OCI repo, tag "artifacthub.io"
#   - raw install manifest + chart .tgz attached to a GitHub release here
#
# Nothing is published when either platform of the image has a CRITICAL or HIGH
# vulnerability with a fixed version: the scan runs before the first push.
#
# Off until the migration's release step (MIGRATION.md): korurlabs/village still
# publishes to the same ghcr.io packages on its kagi-operator/v* tags, and two
# publishers must not race. Turn it on with the repository variable
# PUBLISH_RELEASES=true once village's release workflow is removed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CHART_DIR: charts/kagi-operator
  ARTIFACTHUB_REPO_FILE: charts/artifacthub-repo.yml
  IMAGE: ghcr.io/korurlabs/kagi-operator
  CHART_OCI_PUSH_TARGET: oci://ghcr.io/korurlabs/charts
  CHART_OCI_REF: ghcr.io/korurlabs/charts/kagi-operator
  CHART_PACKAGE_DIR: /tmp/kagi-operator-chart

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: vars.PUBLISH_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The job token can write packages; it is not left in .git/config, where
      # every later step, the vulnerability scanner included, could read it.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Could not derive version from ref '$GITHUB_REF_NAME' (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # A release never publishes an image with a CRITICAL or HIGH vulnerability
      # that has a fixed version. The Docker daemon cannot hold a multi-arch
      # image under one tag, so each platform is built and loaded on its own,
      # under a local tag, and scanned; the base image's packages can differ per
      # platform, so both are scanned. The multi-arch push below keeps its inputs
      # unchanged and runs on the same builder, so every layer comes from the
      # build cache: what it pushes is what was scanned, and the slow arm64 build
      # under QEMU still runs only once. The builds and the scans run before the
      # registry login, so the scanner never runs while a credential that can
      # push packages is on disk.
      - name: Build amd64 image for the vulnerability scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: kagi-operator:scan-amd64

      - name: Build arm64 image for the vulnerability scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: kagi-operator:scan-arm64

      # The vulnerability database is rebuilt every few hours; the copy the Trivy
      # workflow saves on main once a day keeps the download off most runs. A
      # release only restores it, so it adds no cache entry of its own.
      - name: Date for the Trivy cache key
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the Trivy database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-

      # trivy-action had its version tags hijacked on 2026-03-19
      # (GHSA-69fq-xp46-6x23): it is pinned to the commit of 0.35.0, which Aqua
      # states was not affected, and the binary to a fixed version published
      # after the incident. Never move either to a tag or `latest`.
      - name: Scan amd64 image for fixable CRITICAL and HIGH vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.76.2
          # The database is cached by the step above.
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
          scan-type: image
          image-ref: kagi-operator:scan-amd64
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

      # The previous step installed the same Trivy binary on the PATH.
      - name: Scan arm64 image for fixable CRITICAL and HIGH vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          skip-setup-trivy: 'true'
          cache: 'false'
          cache-dir: ${{ runner.temp }}/trivy-cache
          scan-type: image
          image-ref: kagi-operator:scan-arm64
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Log in to ghcr.io (Docker)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The kagi-init launcher binary is baked into this same image (see
      # Dockerfile) and self-resolved at runtime by the mutating webhook's init
      # container; there is no separate kagi-init image.
      - name: Build and push multi-arch operator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Package Helm chart
        run: |
          mkdir -p "${{ env.CHART_PACKAGE_DIR }}"
          helm package "${{ env.CHART_DIR }}" \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination "${{ env.CHART_PACKAGE_DIR }}"

      - name: Log in to ghcr.io (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Push Helm chart to ghcr.io (OCI)
        run: |
          helm push \
            "${{ env.CHART_PACKAGE_DIR }}/kagi-operator-${{ steps.version.outputs.version }}.tgz" \
            "${{ env.CHART_OCI_PUSH_TARGET }}"

      - name: Set up ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      - name: Log in to ghcr.io (ORAS)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # Artifact Hub ownership claim for an OCI Helm chart repository:
      # https://artifacthub.io/docs/topics/repositories/helm-charts/
      - name: Publish Artifact Hub ownership metadata
        run: |
          oras push "${{ env.CHART_OCI_REF }}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${{ env.ARTIFACTHUB_REPO_FILE }}:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Render raw install manifests
        run: make build-installer IMG="${{ env.IMAGE }}:${{ steps.version.outputs.version }}"

      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          ## Install

          ### Helm (OCI)
          \`\`\`sh
          helm install kagi-operator oci://ghcr.io/korurlabs/charts/kagi-operator --version ${VERSION}
          \`\`\`

          ### kubectl (raw manifests)
          \`\`\`sh
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/install.yaml
          \`\`\`

          **Image:** \`ghcr.io/korurlabs/kagi-operator:${VERSION}\`
          **Chart:** \`oci://ghcr.io/korurlabs/charts/kagi-operator:${VERSION}\`
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/install.yaml \
            "${{ env.CHART_PACKAGE_DIR }}/kagi-operator-${{ steps.version.outputs.version }}.tgz" \
            --title "kagi-operator ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
