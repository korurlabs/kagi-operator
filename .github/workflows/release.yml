name: Release

# Public release of the open-source kagi-operator artifacts, on a v* tag such as
# v0.5.0:
#   - multi-arch container image  -> ghcr.io/korurlabs/kagi-operator
#   - Helm chart (OCI)            -> oci://ghcr.io/korurlabs/charts/kagi-operator
#   - Artifact Hub ownership blob -> same OCI repo, tag "artifacthub.io"
#   - raw install manifest + chart .tgz attached to a GitHub release here
#
# Off until the migration's release step (MIGRATION.md): korurlabs/village still
# publishes to the same ghcr.io packages on its kagi-operator/v* tags, and two
# publishers must not race. Turn it on with the repository variable
# PUBLISH_RELEASES=true once village's release workflow is removed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CHART_DIR: charts/kagi-operator
  ARTIFACTHUB_REPO_FILE: charts/artifacthub-repo.yml
  IMAGE: ghcr.io/korurlabs/kagi-operator
  CHART_OCI_PUSH_TARGET: oci://ghcr.io/korurlabs/charts
  CHART_OCI_REF: ghcr.io/korurlabs/charts/kagi-operator
  CHART_PACKAGE_DIR: /tmp/kagi-operator-chart

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: vars.PUBLISH_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Could not derive version from ref '$GITHUB_REF_NAME' (expected vX.Y.Z)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io (Docker)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The kagi-init launcher binary is baked into this same image (see
      # Dockerfile) and self-resolved at runtime by the mutating webhook's init
      # container; there is no separate kagi-init image.
      - name: Build and push multi-arch operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          mkdir -p "${{ env.CHART_PACKAGE_DIR }}"
          helm package "${{ env.CHART_DIR }}" \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination "${{ env.CHART_PACKAGE_DIR }}"

      - name: Log in to ghcr.io (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Push Helm chart to ghcr.io (OCI)
        run: |
          helm push \
            "${{ env.CHART_PACKAGE_DIR }}/kagi-operator-${{ steps.version.outputs.version }}.tgz" \
            "${{ env.CHART_OCI_PUSH_TARGET }}"

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2

      - name: Log in to ghcr.io (ORAS)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # Artifact Hub ownership claim for an OCI Helm chart repository:
      # https://artifacthub.io/docs/topics/repositories/helm-charts/
      - name: Publish Artifact Hub ownership metadata
        run: |
          oras push "${{ env.CHART_OCI_REF }}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "${{ env.ARTIFACTHUB_REPO_FILE }}:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Render raw install manifests
        run: make build-installer IMG="${{ env.IMAGE }}:${{ steps.version.outputs.version }}"

      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          ## Install

          ### Helm (OCI)
          \`\`\`sh
          helm install kagi-operator oci://ghcr.io/korurlabs/charts/kagi-operator --version ${VERSION}
          \`\`\`

          ### kubectl (raw manifests)
          \`\`\`sh
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/install.yaml
          \`\`\`

          **Image:** \`ghcr.io/korurlabs/kagi-operator:${VERSION}\`
          **Chart:** \`oci://ghcr.io/korurlabs/charts/kagi-operator:${VERSION}\`
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/install.yaml \
            "${{ env.CHART_PACKAGE_DIR }}/kagi-operator-${{ steps.version.outputs.version }}.tgz" \
            --title "kagi-operator ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
