# Version updates for the workflows only. The operator's Go modules and
# Dockerfile are copied from korurlabs/village (see MIGRATION.md), and each sync
# replaces them, so their updates belong in village until this repository is the
# source of truth. Everything under .github/ is kept by the sync, so updates to
# it stick.
#
# Minor and patch bumps share one pull request; a major bump gets its own
# because it may break. The cooldown holds a release back for a week, so a
# hijacked version is usually yanked before it reaches a pull request.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
