{{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
# Dev-convenience wrapping of a raw PAT into a Secret. Prefer auth.existingSecret
# in any environment where `helm get values`/release-history exposure of the
# PAT is a concern -- see values.yaml `auth` block.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kagi-operator.fullname" . }}-token
  namespace: {{ include "kagi-operator.tokenSecretNamespace" . }}
  labels:
    {{- include "kagi-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.existingSecretKey | default "token" }}: {{ .Values.auth.token | quote }}
{{- end }}
