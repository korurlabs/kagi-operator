{{- if .Values.injection.enabled }}
{{- $fullname := include "kagi-operator.fullname" . }}
{{- $svcName := include "kagi-operator.webhookServiceName" . }}
{{- $ns := .Release.Namespace }}
---
# Fronts the mutating webhook's HTTPS server (port 9443 in-container) so the
# API server's MutatingWebhookConfiguration can reach it via a stable
# ClusterIP. Mirrors config/webhook/service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
  labels:
    {{- include "kagi-operator.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: {{ .Values.injection.containerPort }}
  selector:
    {{- include "kagi-operator.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager

---
# Only pods carrying the label kagi.pw/inject: "true" are ever sent to this
# webhook (objectSelector). Kubernetes selectors match LABELS, not
# annotations, so that label is the sole opt-in; per-pod config
# (kagi.pw/app-id, kagi.pw/environment, ...) travels as annotations and does
# NOT gate admission. Because unlabeled pods never reach it, failurePolicy:
# Fail never puts unrelated cluster-wide pod admission at risk.
#
# The kustomize path carries the same objectSelector, but it lives in
# config/webhook/objectselector_patch.yaml -- NOT in config/webhook/manifests.yaml,
# which is generated by controller-gen and rewritten by every `make manifests`.
# controller-gen does not emit objectSelector from the +kubebuilder:webhook
# marker, so a hand-added block in manifests.yaml is silently deleted on the next
# regeneration and the released dist/install.yaml ships a webhook that intercepts
# every pod CREATE in the cluster. Keep the selector here and in the patch in
# step; never in manifests.yaml.
#
# NOTE: no caBundle here, deliberately. The operator issues its own TLS
# serving certificate and patches the caBundle onto every entry below at
# startup, then keeps it in sync and rotates ahead of expiry (see
# internal/certs). Templating a caBundle would either require cert-manager
# (an undeclared hard dependency) or Helm's genSelfSignedCert, which mints a
# fresh keypair on every `helm template` render -- so ArgoCD/Flux would show
# this object permanently OutOfSync and each churn would open a window where
# the caBundle and the served certificate disagree.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $fullname }}-mutating-webhook-configuration
  labels:
    {{- include "kagi-operator.labels" . | nindent 4 }}
webhooks:
  - name: mpod.kagi.pw
    admissionReviewVersions: ["v1"]
    sideEffects: None
    reinvocationPolicy: Never
    failurePolicy: {{ .Values.injection.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /mutate--v1-pod
        port: 443
    objectSelector:
      matchLabels:
        kagi.pw/inject: "true"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
{{- end }}
